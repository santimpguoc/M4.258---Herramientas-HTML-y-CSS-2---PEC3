<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Participantes · IV Jornadas de Cocina Tradicional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/styles/main.css" />
  </head>

  <body class="min-h-screen bg-piedra text-tinta font-base">
    <!-- HEADER -->
    <include src="./components/header.html"></include>

    <!-- MAIN -->
    <main>
      <section class="max-w-7xl mx-auto px-4 py-10 md:py-14">

        <!-- Cabecera -->
        <header class="mx-auto max-w-3xl text-center">
          <h1 class="font-heading text-5xl font-bold tracking-tight text-brand md:text-5xl">
            Participantes
          </h1>
          <p class="mt-4 text-xl leading-relaxed text-tinta/80 md:text-xl">
            Tendremos el placer de contar con las siguientes cocineras y cocineros que
            compartirán sus recetas, técnicas y experiencia durante las jornadas.
          </p>
        </header>

        <!-- Grid de participantes -->
        <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">

          <!-- 1. Luis Herrera -->
          <include 
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/luis-herrera.png",
              "imgAlt":"Retrato del chef Luis Herrera",
              "name":"Luis Herrera",
              "role":"Chef ejecutivo – Restaurante La Alacena Vieja (León)",
              "text":"Luis Herrera lleva más de 35 años entre fogones rescatando recetas de pueblo y adaptándolas a los gustos actuales..."
            }'
          ></include>

          <!-- 2. Marina Sanz -->
          <include 
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/marina-sanz.png",
              "imgAlt":"Retrato de la chef Marina Sanz",
              "name":"Marina Sanz",
              "role":"Jefa de cocina – Casa de Comidas El Candil (Sevilla)",
              "text":"Marina Sanz ha convertido el recetario familiar en la base de una cocina honesta y cercana. Domina los guisos de verduras, los estofados de pescado y los postres de cuchara que se servían en las casas de barrio de toda la vida."
            }'
          ></include>   

          <!-- 3. Daniel Okoro -->
          <include
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/daniel-okoro.png",
              "imgAlt":"Retrato del chef Daniel Okoro",
              "name":"Daniel Okoro",
              "role":"Chef invitado – Aromas del Sur (Lisboa)",
              "text":"Daniel Okoro combina técnicas de la cocina de África occidental con productos del Atlántico y del Mediterráneo. Sus currys suaves, estofados aromáticos y panes especiados ponen en valor la cocina de mercado y el uso responsable de las especias."
            }'
          ></include>   

          <!-- 4. Ricardo Valdés -->
          <include
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/ricardo-valdes.png",
              "imgAlt":"Retrato del chef Ricardo Valdés",
              "name":"Ricardo Valdés",
              "role":"Asesor gastronómico y formador culinario",
              "text":"Con una trayectoria en restaurantes de Francia, Italia y España, Ricardo Valdés se centra en reinterpretar platos clásicos con técnicas modernas. Sus talleres se enfocan en fondos, salsas y tiempos de cocción largos para conseguir sabores profundos y equilibrados."
            }'
          ></include>


          <!-- 5. Javier Montalvo -->
          <include
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/javier-montalvo.png",
              "imgAlt":"Retrato del chef Javier Montalvo",
              "name":"Javier Montalvo",
              "role":"Chef propietario – Bistró <em>Fogón de Barrio</em> (Madrid)",
              "text":"Javier Montalvo trabaja con pequeños productores y producto de temporada para crear versiones modernas de platos de toda la vida. Sus croquetas, guisos en raciones pequeñas y cazuelas compartidas son el sello de su propuesta cercana y actual."
            }'
          ></include> 

          <!-- 6. Akiko Mori -->
          <include
            src="./components/participant-card.html"
            locals='{
              "imgSrc":"assets/images/participantes/akiko-mori.png",
              "imgAlt":"Retrato de la chef Akiko Mori",
              "name":"Akiko Mori",
              "role":"Chef invitada – Taller de cocina japonesa tradicional",
              "text":"Akiko Mori se especializa en cocina casera japonesa: caldos dashi, estofados ligeros y recetas que se preparan en las casas de invierno. En sus ponencias muestra cómo integrar técnicas japonesas en guisos occidentales sin perder el carácter de cada tradición."
            }'
          ></include>

        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <include src="./components/footer.html"></include>

    <script type="module" src="./assets/scripts/main.js"></script>
  </body>
</html>
