<article class="participant-card">
  <img
    src="{{ imgSrc }}"
    alt="{{ imgAlt }}"
    class="participant-card__image"
    loading="lazy"
  />
  <div class="participant-card__body">
    <h2 class="participant-card__name">{{ name }}</h2>
    <p class="participant-card__role">{{ role }}</p>
    <p class="participant-card__text">{{ text }}</p>
  </div>
</article>
